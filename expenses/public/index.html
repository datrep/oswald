<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Sheet</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Expense Sheet</div>
      <div class="topbar-right"><button id="signout" class="btn hidden">Sign out</button></div>
    </header>

    <main class="content">
      <div class="panel-head">
        <h2>Expenses</h2>
        <div class="actions">
          <button class="btn" id="btn-sync" title="Copy computer purchases/expenses from the Listing Workbench ledger">Sync from ledger</button>
          <button class="btn" id="exp-csv">CSV</button>
          <button class="btn" id="exp-json">JSON</button>
          <button class="btn primary" id="add-expense">+ Add expense</button>
        </div>
      </div>

      <div class="toolbar">
        <input class="search" id="search" placeholder="Search description / tags…" />
        <select id="f-category-filter" title="Filter by category">
          <option value="">All categories</option>
          <option value="computer">Computer</option>
          <option value="investing">Investing</option>
          <option value="school">School</option>
          <option value="other">Other</option>
        </select>
        <input type="month" id="f-month" title="Filter by month" />
        <button class="btn sm" id="btn-clear-month">All months</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th class="sortable" data-sort="expenseDate">Date</th>
            <th class="sortable" data-sort="category">Category</th>
            <th class="sortable" data-sort="description">Description</th>
            <th class="sortable" data-sort="amount">Amount</th>
            <th>Platform</th>
            <th>Tags</th>
            <th></th>
          </tr></thead>
          <tbody id="expenses-body"></tbody>
        </table>
      </div>
      <p class="muted" id="listings-totals"></p>
    </main>

    <!-- login -->
    <div class="overlay" id="login-modal">
      <div class="modal-card narrow">
        <div class="modal-head"><h3>Sign in</h3></div>
        <div class="modal-body">
          <div class="form-grid">
            <label>Username<input id="login-user" autocomplete="username" /></label>
            <label>Password<input id="login-pass" type="password" autocomplete="current-password" /></label>
          </div>
          <p class="err" id="login-err"></p>
        </div>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button class="btn primary" id="login-btn">Sign in</button>
        </div>
      </div>
    </div>

    <!-- edit modal -->
    <div class="overlay hidden" id="edit-modal">
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="edit-title">Add expense</h3>
          <button class="close" id="edit-close">×</button>
        </div>
        <div class="modal-body">
          <div class="form-grid">
            <label class="full">Description (purpose)<input id="f-description" /></label>
            <label>Amount (S$)<input id="f-amount" type="number" step="0.01" /></label>
            <label>Category
              <select id="f-category">
                <option value="computer">Computer</option>
                <option value="investing">Investing</option>
                <option value="school">School</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>Platform
              <select id="f-platform">
                <option value="">—</option>
                <option value="debit">Debit</option>
                <option value="credit">Credit</option>
              </select>
            </label>
            <label>Date of expense<input id="f-expenseDate" type="date" /></label>
            <label class="full">Tags (comma-separated)<input id="f-tags" placeholder="e.g. gpu, certificate, fees" /></label>
          </div>
          <p class="err" id="edit-status"></p>
        </div>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button class="btn" id="edit-cancel">Cancel</button>
          <button class="btn primary" id="edit-save">Save</button>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
