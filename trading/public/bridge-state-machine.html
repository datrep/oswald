<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oswald — Bridge State Machine (v0)</title>
<style>
  body { font: 13px/1.5 Consolas, Menlo, monospace; background: #101418; color: #d7dde3; margin: 20px; }
  h1 { font-size: 15px; font-weight: 600; color: #9fb3c8; margin: 0 0 4px; }
  .sub { color: #6b7d90; font-size: 12px; margin-bottom: 14px; }
  svg { display: block; }
  .n { fill: #161d26; stroke-width: 1.6; }
  .op { stroke: #3fae6a; } .dg { stroke: #e0a63c; } .dd { stroke: #e05c5c; }
  .t { fill: #d7dde3; font: 600 12px Consolas, monospace; }
  .ts { fill: #9fb3c8; font: 10px Consolas, monospace; }
  .lbl { fill: #7b8ea0; font: 9.5px Consolas, monospace; }
  .hd { fill: #9fb3c8; font: 600 11px Consolas, monospace; }
  .pnl { fill: #131a22; stroke: #223041; stroke-width: 1; }
  .dot { stroke: none; }
  path.a, line.a { stroke: #4a5b6d; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
</style>
</head>
<body>
  <h1>OSWALD — BRIDGE STATE MACHINE v0</h1>
  <div class="sub">source of truth: trading/plus500/bridgeState.js (pure reducer, no I/O) · observer: temp/bridge-state-watch.js (10 s) · live view: /bridge-state.html · legend: ONE mechanical state × orthogonal modifiers → category</div>

  <svg width="1010" height="640" viewBox="0 0 1010 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5b6d"></path>
      </marker>
    </defs>

    <!-- ── nodes ─────────────────────────────────────────────────────────── -->
    <!-- OFF -->
    <rect class="n dd" x="30" y="60" width="140" height="42" rx="10"></rect>
    <text class="t" x="44" y="78">OFF</text>
    <text class="ts" x="44" y="93">no chrome</text>

    <!-- LAUNCHING -->
    <rect class="n dg" x="260" y="60" width="150" height="42" rx="10"></rect>
    <text class="t" x="274" y="78">LAUNCHING</text>
    <text class="ts" x="274" y="93">launch intent ≤ 75 s</text>

    <!-- RESTING (hub) -->
    <rect class="n op" x="260" y="210" width="150" height="46" rx="10"></rect>
    <text class="t" x="274" y="229">RESTING</text>
    <text class="ts" x="274" y="244">attached · settled</text>

    <!-- NAVIGATING -->
    <rect class="n op" x="490" y="210" width="170" height="46" rx="10"></rect>
    <text class="t" x="504" y="229">NAVIGATING</text>
    <text class="ts" x="504" y="244">nav in flight ≤ 12 s</text>

    <!-- BLANK_RENDER -->
    <rect class="n dg" x="490" y="360" width="170" height="46" rx="10"></rect>
    <text class="t" x="504" y="379">BLANK_RENDER</text>
    <text class="ts" x="504" y="394">shell up, not settled</text>

    <!-- WEDGED -->
    <rect class="n dd" x="30" y="210" width="160" height="46" rx="10"></rect>
    <text class="t" x="44" y="229">WEDGED</text>
    <text class="ts" x="44" y="244">attach_timeout · cdp</text>

    <!-- LOGGED_OUT -->
    <rect class="n dd" x="30" y="360" width="160" height="46" rx="10"></rect>
    <text class="t" x="44" y="379">LOGGED_OUT</text>
    <text class="ts" x="44" y="394">login verdict false ≤ 15 m</text>

    <!-- ── transitions ───────────────────────────────────────────────────── -->
    <!-- OFF -> LAUNCHING -->
    <line class="a" x1="170" y1="81" x2="258" y2="81"></line>
    <text class="lbl" x="176" y="75">launch intent</text>

    <!-- LAUNCHING -> RESTING -->
    <path class="a" d="M 335 102 L 335 208"></path>
    <text class="lbl" x="341" y="150">attached</text>

    <!-- LAUNCHING -> WEDGED -->
    <path class="a" d="M 260 87 L 232 87 L 232 226 L 192 226"></path>
    <text class="lbl" x="152" y="124">attach timeout (75 s)</text>

    <!-- WEDGED -> OFF -->
    <path class="a" d="M 60 210 L 60 104"></path>
    <text class="lbl" x="66" y="150">chrome gone</text>

    <!-- RESTING <-> NAVIGATING -->
    <line class="a" x1="410" y1="224" x2="488" y2="224"></line>
    <text class="lbl" x="415" y="218">nav in flight</text>
    <line class="a" x1="488" y1="244" x2="410" y2="244"></line>
    <text class="lbl" x="415" y="258">settled ≤ 12 s</text>

    <!-- NAVIGATING -> BLANK_RENDER -->
    <path class="a" d="M 575 256 L 575 358"></path>
    <text class="lbl" x="581" y="310">12–120 s · no login verdict · feed unbound</text>

    <!-- BLANK_RENDER -> RESTING (elbow left, up, in) -->
    <path class="a" d="M 490 383 L 462 383 L 462 300 L 410 300 L 410 246"></path>
    <text class="lbl" x="466" y="336">settled</text>

    <!-- RESTING -> WEDGED (capture timeout) and back -->
    <line class="a" x1="258" y1="220" x2="192" y2="220"></line>
    <text class="lbl" x="96" y="206">capture_timeout ≤ 5 m</text>
    <line class="a" x1="192" y1="240" x2="258" y2="240"></line>
    <text class="lbl" x="198" y="254">reads resume</text>

    <!-- RESTING -> WEDGED (cdp unattached) -->
    <path class="a" d="M 335 210 L 335 178 L 110 178 L 110 208"></path>
    <text class="lbl" x="112" y="172">cdp_unattached (chrome alive)</text>

    <!-- RESTING -> LOGGED_OUT and back -->
    <path class="a" d="M 260 238 L 226 238 L 226 383 L 192 383"></path>
    <text class="lbl" x="120" y="332">login verdict false</text>
    <path class="a" d="M 192 397 L 226 397 L 226 252 L 258 252"></path>
    <text class="lbl" x="230" y="416">login ok (≤ 15 m)</text>

    <!-- ── right panel — modifiers + categories ─────────────────────────── -->
    <rect class="pnl" x="740" y="40" width="250" height="240" rx="8"></rect>
    <text class="hd" x="754" y="62">MODIFIERS — orthogonal</text>
    <text class="ts" x="754" y="82">isParked</text>
    <text class="lbl" x="754" y="95">wins over everything → QUIET</text>
    <text class="ts" x="754" y="115">healthPaused</text>
    <text class="lbl" x="754" y="128">forces → DEGRADED</text>
    <text class="ts" x="754" y="148">isRecovering (+cause)</text>
    <text class="lbl" x="754" y="161">WEDGED reads DEGRADED while true</text>
    <text class="ts" x="754" y="181">feedSilentForMs</text>
    <text class="ts" x="754" y="196">pageLockHeldBy</text>
    <text class="lbl" x="754" y="209">display / context only — never arbitrate</text>

    <rect class="pnl" x="740" y="300" width="250" height="240" rx="8"></rect>
    <text class="hd" x="754" y="322">CATEGORY — what a glance reads</text>
    <circle class="dot" cx="764" cy="344" r="5" fill="#3fae6a"></circle>
    <text class="ts" x="776" y="348">OPERATIONAL — RESTING · NAVIGATING</text>
    <text class="lbl" x="776" y="362">(nothing parked / paused / recovering)</text>
    <circle class="dot" cx="764" cy="386" r="5" fill="#8a97a5"></circle>
    <text class="ts" x="776" y="390">QUIET — parked (deliberate rest)</text>
    <circle class="dot" cx="764" cy="428" r="5" fill="#e0a63c"></circle>
    <text class="ts" x="776" y="432">DEGRADED — LAUNCHING · BLANK_RENDER</text>
    <text class="lbl" x="776" y="446">· WEDGED (recovering) · healthPaused</text>
    <text class="lbl" x="776" y="460">· any recovery in flight → repair underway</text>
    <circle class="dot" cx="764" cy="494" r="5" fill="#e05c5c"></circle>
    <text class="ts" x="776" y="498">DEAD — OFF · LOGGED_OUT</text>
    <text class="lbl" x="776" y="512">· WEDGED (not recovering) → needs operator</text>

    <!-- footer -->
    <text class="lbl" x="30" y="470">pure: signals in → { state, cause, modifiers, category, since, healthySince } out — every input carries its own timestamp;</text>
    <text class="lbl" x="30" y="484">staleness is per-signal (LAUNCH_PATIENCE 75 s · SETTLE 12 s · CAPTURE_WEDGE_FRESH 5 m · LOGIN_VERDICT_FRESH 15 m).</text>
    <text class="lbl" x="30" y="504">29 pins passing (test/bridge-state.test.js ×12 · test/bridge-state-graph.test.js ×17) · LIVE version: /bridge-state.html (dashboard card + full view) — this poster is the static reference.</text>
  </svg>
</body>
</html>
