<!DOCTYPE html>
<html lang="en">
<head>

<!-- Standard favicon -->
<link rel="icon" href="/favicon/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SomeBoard</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div id="app-header" style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
  <a href="/">
    <img src="images\site logo.png" alt="site" style="height: 40px; object-fit: contain;" />
  </a>
  <h1 style="margin: 0;">SomeBoard</h1>
</div>

<div id="main-menu">
  <a id="nav-sign-up" href="/signup.html">Sign Up</a>
  <a id="nav-log-in" href="/login.html">Log in</a>
  <a id="nav-my-account" href="/profile.html" style="display: none;">My Account</a>
  <a id="nav-edit-profile" href="/edit.html" style="display: none;">Edit Profile</a>
  <a id="nav-logout" href="/logout.html" style="display: none;">Logout</a>
  <a id="nav-posts" href="/index.html">Posts</a>
  <a id="nav-artists" href="/artists">Artists</a>
  <a id="nav-tags" href="/tags">Tags</a>
  <a id="nav-comments" href="/comments">Comments (does not work)</a>
</div>


<div id="container">
  <div id="image-menu">
    <button onclick="window.location.href='create-image.html'">➕ Create New Image</button>
  </div>
  
  <div class="gallery" id="gallery">
    <!-- images inserted here -->
    <!-- Example image preview -->
    <div class="image-card">
      <div class="post-preview-container">
        <img src="images/example.jpg" alt="example">
      </div>
      <div class="image-info">
        <h3>Example Title</h3>
        <p>Uploaded: August 2, 2025, 10:00 AM</p>
        <button class="btn-edit">Edit</button>
        <button class="btn-delete">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="index-script.js"></script>
<script>
  const token = localStorage.getItem('token');

  document.addEventListener('DOMContentLoaded', () => {
    const show = id => document.getElementById(id)?.style && (document.getElementById(id).style.display = '');
    const hide = id => document.getElementById(id)?.style && (document.getElementById(id).style.display = 'none');

    if (token) {
      hide('nav-sign-up');
      hide('nav-log-in');
      show('nav-my-account');
      show('nav-edit-profile');
      show('nav-logout');
    } else {
      show('nav-sign-up');
      show('nav-log-in');
      hide('nav-my-account');
      hide('nav-edit-profile');
      hide('nav-logout');
    }
  });
</script>

</body>
</html>
