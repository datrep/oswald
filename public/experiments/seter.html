<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persistent Timer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
      }

      .main-container {
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .timer-container {
        text-align: center;
        background-color: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .timer {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        color: #333;
      }

      button {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #45a049;
      }

      .history-container {
        background-color: white;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-height: 300px;
        overflow-y: auto;
      }

      .history-title {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #333;
      }

      .history-entry {
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
        font-size: 0.9rem;
      }

      .history-date {
        font-weight: bold;
        color: #4caf50;
      }

      .history-time {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="timer-container">
        <div class="timer" id="timer">00:00:00.000</div>
        <button onclick="resetTimer()">Reset to Zero</button>
      </div>

      <div class="history-container">
        <div class="history-title">Time History</div>
        <div id="history-list"></div>
      </div>
    </div>

    <script>
      let startTime;
      let timerInterval;
      let isRunning = false;
      let elapsedTime = 0;

      // Load history and initialize timer on page load
      function initTimer() {
        // Load previous state from localStorage
        const savedState = JSON.parse(localStorage.getItem('timerState')) || {};

        // Restore elapsed time if it exists in saved state
        if (savedState.elapsedTime) {
          elapsedTime = savedState.elapsedTime;
        }

        // Calculate downtime and add to elapsed time
        if (savedState.lastActiveTime) {
          const now = Date.now();
          const downtime = now - savedState.lastActiveTime;
          elapsedTime += downtime;
        }

        // Update display immediately with accumulated time
        updateTimerDisplay(elapsedTime);

        // Start timer from current moment, accounting for previous elapsed time
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(updateTimer, 10);
        isRunning = true;

        // Save state periodically
        setInterval(saveState, 1000);
      }

      function saveState() {
        localStorage.setItem(
          'timerState',
          JSON.stringify({
            lastActiveTime: Date.now(),
            elapsedTime: elapsedTime,
          })
        );
      }

      // Load history from LocalStorage on page load
      function loadHistory() {
        const history = localStorage.getItem('timerHistory');
        if (history) {
          displayHistory(JSON.parse(history));
        }
      }

      // Save entry to history
      function saveToHistory(timeValue) {
        const date = new Date();
        const formattedDate = `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;

        const historyEntry = {
          date: formattedDate,
          time: timeValue,
        };

        // Load existing history or initialize empty array
        let history = JSON.parse(localStorage.getItem('timerHistory')) || [];
        history.unshift(historyEntry); // Add to beginning (most recent first)

        // Limit to 50 entries to prevent storage bloat
        if (history.length > 50) {
          history.pop();
        }

        localStorage.setItem('timerHistory', JSON.stringify(history));
        displayHistory(history);
      }

      // Display history in the UI
      function displayHistory(history) {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        if (history.length === 0) {
          historyList.innerHTML =
            '<div class="history-entry">No history yet. Reset the timer to start logging.</div>';
          return;
        }

        history.forEach((entry) => {
          const entryDiv = document.createElement('div');
          entryDiv.className = 'history-entry';
          entryDiv.innerHTML = `
                    <span class="history-date">${entry.date}</span>
                    <span class="history-time">${entry.time}</span>
                `;
          historyList.appendChild(entryDiv);
        });
      }

      function updateTimer() {
        elapsedTime = Date.now() - startTime;
        updateTimerDisplay(elapsedTime);
      }

      function updateTimerDisplay(time) {
        const hours = Math.floor(time / (1000 * 60 * 60));
        const minutes = Math.floor((time % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((time % (1000 * 60)) / 1000);
        const milliseconds = Math.floor((time % 1000) / 10);

        const timeString =
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:` +
          `${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;

        document.getElementById('timer').textContent = timeString;
      }

      function resetTimer() {
        // Save current time to history before resetting
        const hours = Math.floor(elapsedTime / (1000 * 60 * 60));
        const minutes = Math.floor((elapsedTime % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((elapsedTime % (1000 * 60)) / 1000);
        const milliseconds = Math.floor((elapsedTime % 1000) / 10);

        const timeString =
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:` +
          `${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;

        saveToHistory(timeString);

        // Reset timer but keep it running
        elapsedTime = 0;
        startTime = Date.now();
      }

      // Initialize
      initTimer();
      loadHistory();
    </script>
  </body>
</html>
