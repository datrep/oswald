<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div id="app-header" style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
  <a href="/">
    <img src="images/site logo.png" alt="site" style="height: 40px; object-fit: contain;" />
  </a>
  <h1 style="margin: 0;">SomeBoard</h1>
</div>

<div id="main-menu">
  <a id="nav-sign-up" href="/signup.html">Sign Up</a>
  <a id="nav-log-in" href="/login.html">Log in</a>
  <a id="nav-my-account" href="/profile.html" style="display: none;">My Account</a>
  <a id="nav-edit-profile" href="/edit.html" style="display: none;">Edit Profile</a>
  <a id="nav-logout" href="/logout.html" style="display: none;">Logout</a>
  <a id="nav-posts" href="/index.html">Posts</a>
  <a id="nav-artists" href="/artists">Artists</a>
  <a id="nav-tags" href="/tags">Tags</a>
  <a id="nav-comments" href="/comments">Comments (does not work)</a>
</div>

<h2>Your Profile</h2>
<div id="profile-info"></div>

<h3>Update Info</h3>
<form id="edit-form">
  <input type="text" id="new-username" placeholder="New Username" required />
  <input type="password" id="new-password" placeholder="New Password" required />
  <button type="submit">Update</button>
</form>

<button id="delete-account">Delete Account</button>
<p id="profile-message"></p>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/login.html';

  async function loadProfile() {
    const res = await fetch('/api/users/me', {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    document.getElementById('profile-info').textContent = data.username
      ? `Username: ${data.username}`
      : data.error;
  }

  document.getElementById('edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('new-username').value;
    const password = document.getElementById('new-password').value;

    const res = await fetch('/api/users/edit', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    document.getElementById('profile-message').textContent = data.message || data.error;
    if (res.ok) loadProfile();
  });

  document.getElementById('delete-account').addEventListener('click', async () => {
    if (!confirm('Are you sure?')) return;
    const res = await fetch('/api/users/delete', {  // ✅ fixed route
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    alert(data.message || data.error);
    if (res.ok) {
      localStorage.removeItem('token');
      window.location.href = '/signup.html';
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    loadProfile();

    // Navbar visibility
    const show = id => document.getElementById(id)?.style && (document.getElementById(id).style.display = '');
    const hide = id => document.getElementById(id)?.style && (document.getElementById(id).style.display = 'none');

    if (token) {
      hide('nav-sign-up');
      hide('nav-log-in');
      show('nav-my-account');
      show('nav-edit-profile');
      show('nav-logout');
    }
  });
</script>

</body>
</html>
