<!-- tasks.html -->
<h1>Tasks</h1>
<div id="tasks-container"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const edictId = urlParams.get('edict');

async function fetchTasks() {
    try {
        const res = await fetch(`/api/tasks/edict/${edictId}`);
        const tasks = await res.json();
        const container = document.getElementById('tasks-container');
        container.innerHTML = '';

        tasks.forEach(task => {
            const div = document.createElement('div');
            div.innerHTML = `
                <h3>${task.name} (${task.active ? 'Active' : 'Inactive'})</h3>
                <p>Planned: ${new Date(task.plannedStart).toLocaleDateString()} - ${new Date(task.plannedEnd).toLocaleDateString()}</p>
                <p>Info: ${task.info}</p>
            `;
            container.appendChild(div);
        });
    } catch (err) {
        console.error(err);
        alert('Failed to fetch tasks');
    }
}

fetchTasks();
</script>
