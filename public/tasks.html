<!-- tasks.html -->
<h1>Tasks</h1>
<button id="back-to-edicts" type="button">Back to Edicts</button>
<div id="tasks-container"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const edictId = urlParams.get('edict');
const container = document.getElementById('tasks-container');
document.getElementById('back-to-edicts').addEventListener('click', () => {
    redirectToEdicts();
});

function showMessage(message) {
    container.innerHTML = `<p>${message}</p>`;
}

function redirectToEdicts() {
    window.location.href = '/edicts.html';
}

function isValidEdictId(value) {
    return /^\d+$/.test(value || '');
}

async function fetchTasks() {
    if (!isValidEdictId(edictId)) {
        redirectToEdicts();
        return;
    }

    try {
        const res = await fetch(`/api/tasks/edict/${edictId}`);

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const tasks = await res.json();
        container.innerHTML = '';

        if (!Array.isArray(tasks) || tasks.length === 0) {
            showMessage('No tasks found for this edict.');
            return;
        }

        tasks.forEach(task => {
            const div = document.createElement('div');
            div.innerHTML = `
                <h3>${task.name} (${task.active ? 'Active' : 'Inactive'})</h3>
                <p>Planned: ${new Date(task.plannedStart).toLocaleDateString()} - ${new Date(task.plannedEnd).toLocaleDateString()}</p>
                <p>Info: ${task.info}</p>
            `;
            container.appendChild(div);
        });
    } catch (err) {
        console.error(err);
        showMessage('Failed to fetch tasks.');
    }
}

fetchTasks();
</script>
