<!-- edicts.html -->
<h1>Edicts Dashboard</h1>
<div id="edicts-container"></div>

<script>
async function fetchEdicts() {
    try {
        const res = await fetch('/api/edicts');
        const edicts = await res.json();
        const container = document.getElementById('edicts-container');
        container.innerHTML = '';

        edicts.forEach(edict => {
            const div = document.createElement('div');
            div.innerHTML = `
                <h2>${edict.name} (${edict.active ? 'Active' : 'Inactive'})</h2>
                <p>Planned: ${new Date(edict.plannedStart).toLocaleDateString()} - ${new Date(edict.plannedEnd).toLocaleDateString()}</p>
                <p>Info: ${edict.info}</p>
                <button onclick="viewTasks(${edict.id})">View Tasks</button>
                <button onclick="viewResources(${edict.id})">View Resources</button>
            `;
            container.appendChild(div);
        });
    } catch (err) {
        console.error(err);
        alert('Failed to fetch Edicts');
    }
}

fetchEdicts();

function viewTasks(edictId) {
    window.location.href = `/tasks.html?edict=${edictId}`;
}

function viewResources(edictId) {
    window.location.href = `/resources.html?edict=${edictId}`;
}
</script>
