<!doctype html>
<html>
  <head>
    <title>Policy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>

  <body>
    <div class="content">
      <div class="layout layout--policy">
        <div class="topbar">
          <a href="/index.html" class="back-link">
            <img src="/images/arrow.jpg" alt="Dashboard" width="15px" />
          </a>
          <div class="topbar-title">Policy Workspace</div>
          <div id="auth-control"></div>
        </div>

        <div class="policy-scroll">
        <h2 id="policy-title">Policy</h2>

        <div class="policy-columns">

        <!-- POLICY DETAILS -->

        <div class="policy-section">
          <div class="section-header">
            <h2>Policy Details</h2>
            <button id="edit-policy">Edit Policy</button>
          </div>
          <!--to change row to box/list style, update CSS and this template accordingly-->
          <div class="policy-header">
            <span data-sort="plannedStart">Start</span>
            <span data-sort="plannedEnd">End</span>
            <span data-sort="taskCount">Task count</span>
            <span data-sort="active">Active</span>
            <span data-sort="priority">Priority</span>
            <span data-sort="state">State</span>
            <span data-sort="info">Description</span>
          </div>
          <div id="policy-list"></div>

          <!-- todo implementation, derived from database  -->
          <div class="policy-description"></div>
        </div>

        <!-- TASKS -->

        <div class="policy-section">
          <div class="section-header">
            <h2>Tasks</h2>
            <button id="add-task">Add Task</button>
          </div>

          <!-- CONTEXTUAL TOOLBAR (LLM-assisted): Appears when tasks are selected -->
          <div id="task-context-toolbar" class="task-context-toolbar hidden">
            <span id="task-selected-count">0 selected</span>
            <button id="edit-task">Edit</button>
            <button id="delete-task">Delete</button>
          </div>

          <div class="task-header">
            <!-- SORTABLE TASK HEADER (LLM-assisted): click columns to sort asc/desc -->
            <span data-sort="name">Name</span>
            <span data-sort="plannedStart">Start</span>
            <span data-sort="plannedEnd">End</span>
            <span data-sort="priority">Priority</span>
            <span data-sort="state">State</span>
            <span data-sort="active">Active</span>
            <span data-sort="info">Description</span>
            <span>select</span>
            <!-- END SORTABLE TASK HEADER (LLM-assisted) -->
          </div>

          <div id="task-list"></div>
        </div>
        </div>

        <div class="task-ender"></div>
        <!-- just a line to separate the sections, not an actual header -->

        <!-- RESOURCES -->

        <div class="policy-section">
          <div class="section-header">
            <h2>Resources</h2>
            <button id="add-resource">Add Resource</button>
          </div>

          <!-- CONTEXTUAL TOOLBAR (LLM-assisted): Appears when resources are selected -->
          <div id="resource-context-toolbar" class="resource-context-toolbar hidden">
            <span id="resource-selected-count">0 selected</span>
            <button id="edit-resource">Edit</button>
            <button id="delete-resource">Delete</button>
          </div>

          <div id="resource-modal" style="display: none">
            <div class="modal-resource-content">
              <h3 id="resource-modal-title">Add Resource</h3>

              <label for="resource-file">Choose File</label>
              <input type="file" id="resource-file" />

              <label for="resource-description">Description</label>
              <textarea id="resource-description"></textarea>

              <div class="modal-actions">
                <button id="save-resource">Save</button>
                <button id="cancel-resource">Cancel</button>
              </div>
            </div>
          </div>

          <div id="resource-preview-list"></div>
        </div>
        </div>

        <div class="policy-controls">
          <button id="save-policy">Save Policy</button>
          <button id="delete-policy">Delete Policy</button>
        </div>
      </div>
    </div>

    <div id="policy-modal" class="modal">
      <div class="modal-content">
        <h2 id="policy-modal-title">Edit Policy</h2>
        <form id="policy-form" class="policy-form" novalidate>
          <!-- BASIC FIELDS — always visible -->
          <div class="form-field">
            <div class="label-with-help">
              <label for="policy-name">Name</label>
              <button
                type="button"
                class="help-btn"
                id="help-policy-name"
                aria-label="More info about policy name"
              >
                ?
              </button>
            </div>
            <input id="policy-name" name="name" type="text" placeholder="Policy name" required />
            <div class="field-error"></div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="policy-start">Planned Start</label>
              <input id="policy-start" name="plannedStart" type="datetime-local" required />
              <div class="field-error"></div>
            </div>
            <div class="form-field">
              <label for="policy-end">Planned End</label>
              <input id="policy-end" name="plannedEnd" type="datetime-local" />
              <div class="input-actions">
                <button type="button" id="policy-end-now">Now</button>
                <button type="button" id="policy-end-clear">Leave blank</button>
              </div>
              <div class="field-error"></div>
            </div>
          </div>

          <!-- ADVANCED FIELDS — collapsed by default -->
          <button type="button" id="policy-advanced-toggle" class="advanced-toggle">
            <span class="toggle-arrow">▶</span> Advanced
          </button>

          <div id="policy-advanced-fields" class="advanced-fields hidden">
            <div class="form-row">
              <div class="form-field">
                <label for="policy-priority">Priority</label>
                <select id="policy-priority" name="priority">
                  <option value="">-</option>
                  <option value="0">P0 Critical</option>
                  <option value="1">P1 High</option>
                  <option value="2">P2 Medium</option>
                  <option value="3">P3 Low</option>
                </select>
              </div>
              <div class="form-field">
                <label for="policy-state">State</label>
                <select id="policy-state" name="state"></select>
              </div>
            </div>

            <div class="form-field">
              <label for="policy-info">Description</label>
              <textarea id="policy-info" name="info" placeholder="Optional description"></textarea>
            </div>
          </div>

          <p class="form-feedback hidden" id="policy-form-feedback"></p>

          <div class="modal-buttons">
            <button type="submit" id="modal-save-policy">Save</button>
            <button type="button" id="modal-delete-policy">Delete</button>
            <button type="button" id="cancel-policy">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="task-modal" class="modal">
      <div class="modal-content">
        <h2 id="task-modal-title">Add Task</h2>

        <form id="task-form" class="task-form" novalidate>
          <!-- BASIC FIELDS — always visible -->
          <div class="form-field">
            <div class="label-with-help">
              <label for="task-name">Name</label>
              <button
                type="button"
                class="help-btn"
                id="help-task-name"
                aria-label="More info about task name"
              >
                ?
              </button>
            </div>
            <input id="task-name" name="name" type="text" placeholder="Task name" required />
            <div class="field-error"></div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="task-start">Planned Start</label>
              <input id="task-start" name="plannedStart" type="datetime-local" required />
              <div class="field-error"></div>
            </div>
            <div class="form-field">
              <label for="task-end">Planned End</label>
              <input id="task-end" name="plannedEnd" type="datetime-local" />
              <div class="input-actions">
                <button type="button" id="task-end-now">Now</button>
                <button type="button" id="task-end-clear">Leave blank</button>
              </div>
              <div class="field-error"></div>
            </div>
          </div>

          <!-- ADVANCED FIELDS — collapsed by default -->
          <button type="button" id="task-advanced-toggle" class="advanced-toggle">
            <span class="toggle-arrow">▶</span> Advanced
          </button>

          <div id="task-advanced-fields" class="advanced-fields hidden">
            <div class="form-row">
              <div class="form-field">
                <label for="task-priority">Priority</label>
                <select id="task-priority" name="priority">
                  <option value="">- (inherit from policy)</option>
                  <option value="0">P0 Critical</option>
                  <option value="1">P1 High</option>
                  <option value="2">P2 Medium</option>
                  <option value="3">P3 Low</option>
                </select>
              </div>
              <div class="form-field">
                <label for="task-state">State</label>
                <select id="task-state" name="state"></select>
              </div>
            </div>

            <div class="form-field">
              <label for="task-info">Description</label>
              <textarea id="task-info" name="info" placeholder="Optional description"></textarea>
            </div>

            <div class="form-field">
              <label for="task-user">Assigned User</label>
              <input id="task-user" name="assignedToUserId" type="number" placeholder="User ID (optional)" />
            </div>
          </div>

          <div class="modal-buttons">
            <button type="submit" id="create-task">Create Task</button>
            <button type="button" id="cancel-task">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- TODO:// client specific flags -->
  </body>

  <!-- helpers.js is a classic script: load it before the modules so its globals are available -->
  <script src="/js/utils/helpers.js"></script>
  <script type="module" src="/js/pages/policy.js"></script>
  <script type="module" src="/js/components/auth.js"></script>
</html>
