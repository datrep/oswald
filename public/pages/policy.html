<!DOCTYPE html>
<html>

<head>

<title>Policy</title>

<link rel="stylesheet" href="/css/main.css">

</head>

<body>

<div class="layout">

<div class="sidebar">

<button onclick="window.location.href='/'">Back</button>

</div>


<div class="content">

<h1 id="policy-title"></h1>


<section>

<h2>Tasks</h2>

<button id="add-task">Add Task</button>

<div id="task-list"></div>

</section>


<section>

<h2>Resources</h2>

<button id="add-resource">Add Resource</button>

<div id="resource-list"></div>

</section>


<section>

<h2>Audit Log</h2>

<div id="audit-log"></div>

</section>

</div>

</div>


<!-- ADD TASK FORM -->

<div id="task-modal" class="modal hidden">

<form id="task-form">

<h3>Create Task</h3>

<!-- ASSUMPTION:
backend task fields:
title
description
edictId
-->

<input name="title" placeholder="Task Title" required>

<textarea name="description"></textarea>

<button type="submit">Create</button>

<button type="button" id="close-task">Cancel</button>

</form>

</div>


<!-- ADD RESOURCE FORM -->

<div id="resource-modal" class="modal hidden">

<form id="resource-form">

<h3>Add Resource</h3>

<!-- ASSUMPTION:
resource table fields:

name
type ("file" or "path")
path
edictId
-->

<input name="name" placeholder="Resource Name" required>

<select name="type">

<option value="file">Attachment</option>
<option value="path">Dynamic Path</option>

</select>

<input name="path" placeholder="File path or URL">

<button type="submit">Add</button>

<button type="button" id="close-resource">Cancel</button>

</form>

</div>


<script type="module" src="/js/pages/policy.js"></script>

</body>

</html>
