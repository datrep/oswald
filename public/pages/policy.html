<!DOCTYPE html>
<html>

<head>
<title>Policy</title>
<link rel="stylesheet" href="/css/main.css">
</head>

<body>


<div class="layout layout--policy">

    <div class="topbar">
        <div class="topbar-title">Policy workspace</div>
    </div>

    <div class="content">

<h1 id="policy-title">Policy</h1>

<!-- POLICY DETAILS -->

<div class="policy-section">

<h2>Policy Details</h2>

<div id="policy-form-panel" class="policy-form-panel hidden">
<div id="policy-form" class="policy-form">

<label>Name</label>
<input id="policy-name" type="text">

<label>Planned Start</label>
<input id="policy-start" type="datetime-local">

<label>Planned End</label>
<input id="policy-end" type="datetime-local">

<label>Priority</label>
<input id="policy-priority" type="number">

<label>State</label>
<select id="policy-state">
<option value="1">Draft</option>
<option value="2">Published</option>
<option value="3">Archived</option>
</select>

<label>Description</label>
<textarea id="policy-info"></textarea>

</div>
</div>

</div>

<!-- TASKS -->

<div class="policy-section">

<h2>Tasks</h2>

<div class="task-controls">
<button id="add-task">Add Task</button>
<button id="remove-task">Remove selected</button>
<button id="edit-task">Edit Task</button>
</div>

<div class="task-header">
<span>Name</span>
<span>Start</span>
<span>End</span>
<span>Priority</span>
<span>State</span>
<span>Active</span>
<span>Description</span>
<span>select</span>
</div>

<div id="task-list"></div>

</div>

<div class="task-ender"></div> <!-- just a line to separate the sections, not an actual header -->

<!-- RESOURCES -->

<div class="policy-section">

<h2>Resources</h2>

<div class="resource-controls">
    <button id="add-resource">Add Resource</button>
    <button id="edit-resource">Edit Selected</button>
    <button id="remove-resource">Remove Selected</button>
</div>

<div class="resource-header">
    <span>Web Path</span>
    <span>Resource Path</span>
    <span>Description</span>
    <span>Select</span>
</div>

<div id="resource-list"></div>


</div>

</div>
<div class="policy-controls">

<button id="edit-policy">Edit Policy</button>
<button id="save-policy">Save Policy</button>
<button id="delete-policy">Delete Policy</button>

</div>



<div id="task-modal" class="modal">

<div class="modal-content">

<h2>Add Task</h2>

<div class="task-form">

<label>Name</label>
<input id="task-name" type="text">

<label>Planned Start</label>
<input id="task-start" type="datetime-local">

<label>Planned End</label>
<input id="task-end" type="datetime-local">

<label>Priority</label>
<input id="task-priority" type="number">

<label>State</label>
<select id="task-state">
<option value="1">Draft</option>
<option value="2">Published</option>
<option value="3">Archived</option>
</select>

<label>Description</label>
<textarea id="task-info"></textarea>

<label>Assigned User</label>
<input id="task-user" type="number">

<div class="modal-buttons">
<button id="create-task">Create Task</button>
<button id="cancel-task">Cancel</button>
</div>

</div>

</div>

</div>

<div id="resource-modal" style="display:none">

    <div class="modal-content">

        <h3 id="resource-modal-title">Add Resource</h3>

        <label for="resource-file">Choose File</label>
        <input type="file" id="resource-file">

        <label for="resource-description">Description</label>
        <textarea id="resource-description"></textarea>

        <div class="modal-actions">
            <button id="save-resource">Save</button>
            <button id="cancel-resource">Cancel</button>
        </div>

    </div>

</div>

</body>

<!-- please put it at the bottom so i dont have to think of committing sion e onto traffic -->
<script type="module" src="/js/pages/policy.js"></script>


</html>
