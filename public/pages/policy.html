<!DOCTYPE html>
<html>

<head>
<title>Policy</title>
<link rel="stylesheet" href="/css/main.css">
</head>

<body>

<div class="layout">

<div class="content">

<h1 id="policy-title">Policy</h1>

<!-- POLICY DETAILS -->

<div class="policy-section">

<h2>Policy Details</h2>

<div class="policy-form">

<label>Name</label>
<input id="policy-name" type="text">

<label>Planned Start</label>
<input id="policy-start" type="datetime-local">

<label>Planned End</label>
<input id="policy-end" type="datetime-local">

<label>Priority</label>
<input id="policy-priority" type="number">

<label>State</label>
<select id="policy-state">
<option value="1">Draft</option>
<option value="2">Published</option>
<option value="3">Archived</option>
</select>

<label>Description</label>
<textarea id="policy-info"></textarea>

</div>

</div>

<!-- TASKS -->

<div class="policy-section">

<h2>Tasks</h2>

<div class="task-controls">
<button id="add-task">Add Task</button>
<button id="remove-task">Remove Task</button>
</div>

<div class="task-header">
<span>Name</span>
<span>Start</span>
<span>End</span>
<span>Priority</span>
<span>State</span>
<span>Active</span>
<span>Description</span>
<span>edit?</span>
</div>

<div id="task-list"></div>

</div>

<!-- RESOURCES -->

<div class="policy-section">

<h2>Resources</h2>

<div class="resource-controls">
<button id="add-resource">Add Resource</button>
</div>

<div class="resource-header">
<span>Path</span>
<span>Description</span>
</div>

<div id="resource-list"></div>

</div>

</div>

</div>



<div class="policy-controls">

<button id="edit-policy">Edit Policy</button>
<button id="save-policy">Save Policy</button>
<button id="delete-policy">Delete Policy</button>
</body>

<!-- please put it at the bottom so i dont have to think of committing sion e onto traffic -->
<script type="module" src="/js/pages/policy.js"></script>


</html>
