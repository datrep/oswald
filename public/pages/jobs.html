<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png" />
    <title>Job Applications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
    <style>
      /* Job-specific styles only — generic components (btn/toolbar/stats/card/chip/empty/form-grid/modal-overlay/feedback) come from main.css. */
      .jb-site { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; color: var(--text); text-decoration: none; }
      .jb-site:hover { border-color: var(--accent); color: var(--accent); }
      .jb-view-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .jb-view-toggle button { background: var(--panel-2); border: none; color: var(--muted); padding: 6px 10px; cursor: pointer; }
      .jb-view-toggle button.active { background: var(--accent-soft); color: var(--accent); }
      .jb-board { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
      .jb-col { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; min-height: 120px; }
      .jb-col.drag-over { border-color: var(--accent); background: var(--accent-soft); }
      .jb-col-head { padding: 8px 10px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
      .jb-col-count { color: var(--accent); }
      .jb-col-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
      .jb-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: grab; }
      .jb-card:hover { border-color: var(--accent); }
      .jb-card.dragging { opacity: 0.45; }
      .jb-company { font-weight: 700; font-size: 0.85rem; }
      .jb-role { color: var(--muted); font-size: 0.78rem; }
      .jb-card-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
      .jb-src { font-size: 0.62rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; text-transform: uppercase; }
      .jb-src.mycareersfuture { background: rgba(168,85,247,0.16); color: #d8b4fe; }
      .jb-src.jobstreet { background: rgba(59,130,246,0.16); color: #93c5fd; }
      .jb-src.internsg { background: rgba(52,211,153,0.14); color: #6ee7b7; }
      .jb-src.other { background: var(--panel-3); color: var(--muted); }
      .jb-salary { color: var(--muted); font-size: 0.74rem; }
      .jb-due { font-size: 0.72rem; font-weight: 600; }
      .jb-due.is-overdue { color: #f87171; }
      .jb-due.is-today { color: #fcd34d; }
      .jb-card-actions { display: flex; gap: 4px; margin-top: 6px; }
      .jb-list { display: flex; flex-direction: column; gap: 8px; }
      .jb-list-row { display: grid; grid-template-columns: 1.4fr 1fr 90px 90px 90px auto; gap: 10px; align-items: center; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; }
      .jb-list-row .jb-company { font-weight: 700; }
      .jb-list-row .jb-role { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <div class="layout">
        <aside class="sidebar">
          <section class="sidebar-block">
            <h3 class="sidebar-section">Navigation</h3>
            <div class="sidebar-panel sidebar-links">
              <a href="/index.html">Dashboard</a>
              <a href="/pages/policy.html">Policy workspace</a>
              <a href="https://172.22.160.3:8090" target="_blank" rel="noopener">Fileserver</a>
            </div>
          </section>
          <section class="sidebar-block">
            <h3 class="sidebar-section">Career</h3>
            <div class="sidebar-panel sidebar-links">
              <a href="/pages/jobs.html">Job Applications</a>
              <a href="/pages/career-files.html">Career Files</a>
              <a href="/pages/certs.html">Certificates</a>
            </div>
          </section>
        </aside>
        <main class="main">
          <div class="topbar">
            <div style="color: #7279db">Job Applications</div>
            <div class="topbar-right"><div id="auth-control"></div></div>
          </div>
          <div class="content">
            <div id="module-tabs"></div>
            <div style="margin: 10px 0 4px">
              <button type="button" class="back-link" id="jb-back">← Back</button>
            </div>
            <div id="jb-gate" class="hidden">
              <h2>Sign in required</h2>
              <p class="muted">Sign in to view and manage your job applications.</p>
            </div>
            <div id="jb-app" class="hidden">
              <div class="toolbar">
                <a class="jb-site" href="https://www.mycareersfuture.gov.sg/" target="_blank" rel="noopener">MyCareersFuture</a>
                <a class="jb-site" href="https://sg.jobstreet.com/" target="_blank" rel="noopener">JobStreet SG</a>
                <a class="jb-site" href="https://www.internsg.com/" target="_blank" rel="noopener">InternSG</a>
                <div class="toolbar-cluster">
                  <select id="jb-source">
                    <option value="">All sources</option>
                    <option value="mycareersfuture">MyCareersFuture</option>
                    <option value="jobstreet">JobStreet</option>
                    <option value="internsg">InternSG</option>
                    <option value="other">Other</option>
                  </select>
                  <input type="search" id="jb-search" placeholder="Search company / role…" autocomplete="off" />
                  <select id="jb-sort" title="Sort">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="company">Company A–Z</option>
                    <option value="company_desc">Company Z–A</option>
                    <option value="salary">Salary high → low</option>
                    <option value="due">Follow-up soonest</option>
                  </select>
                </div>
                <div class="jb-view-toggle">
                  <button id="jb-view-kanban" class="active" title="Kanban">Kanban</button>
                  <button id="jb-view-list" title="List">List</button>
                </div>
                <button type="button" id="jb-add" class="btn btn--primary">+ Add application</button>
                <button type="button" id="np-toggle" class="btn" title="Persistent notepad — autosaves to this browser">Notepad</button>
              </div>

              <div id="np-panel" class="hidden">
                <div class="np-head">
                  <strong>Notepad</strong>
                  <span id="np-count" class="np-count"></span>
                  <button type="button" id="np-copy">Copy all</button>
                  <button type="button" id="np-clear">Clear</button>
                  <span id="np-copied" class="np-copied"></span>
                  <button type="button" id="np-close" title="Close">✕</button>
                </div>
                <textarea id="np-text" placeholder="Snippets, notes, text to reuse — autosaved here. Click ✎ on a job card to add it, then Copy all to paste elsewhere."></textarea>
              </div>

              <div class="stats" id="jb-stats"></div>
              <div id="jb-board" class="jb-board"></div>
              <div id="jb-list" class="jb-list hidden"></div>
              <div class="feedback" id="jb-status"></div>
            </div>
          </div>
        </main>
      </div>
    </header>

    <div id="jb-modal" class="modal-overlay">
      <div class="modal-card">
        <h3 id="jb-modal-title" class="modal__head">Add application</h3>
        <div class="form-grid">
          <div class="field"><label>Company *</label><input id="f-company" /></div>
          <div class="field"><label>Role *</label><input id="f-role" /></div>
          <div class="field">
            <label>Source</label>
            <select id="f-source">
              <option value="mycareersfuture">MyCareersFuture</option>
              <option value="jobstreet">JobStreet</option>
              <option value="internsg">InternSG</option>
              <option value="other" selected>Other</option>
            </select>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="f-status">
              <option value="applied" selected>Applied</option>
              <option value="screening">Screening</option>
              <option value="assessment">Assessment</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="hired">Hired</option>
              <option value="rejected">Rejected</option>
              <option value="withdrawn">Withdrawn</option>
            </select>
          </div>
          <div class="field field--full"><label>Job URL</label><input id="f-joburl" /></div>
          <div class="field"><label>Applied date</label><input type="datetime-local" id="f-applied" /></div>
          <div class="field"><label>Follow-up date</label><input type="datetime-local" id="f-followup" /></div>
          <div class="field"><label>Salary</label><input id="f-salary" /></div>
          <div class="field"><label>Location</label><input id="f-location" /></div>
          <div class="field"><label>Contact</label><input id="f-contact" /></div>
          <div class="field">
            <label>Resume / cover letter</label>
            <select id="f-resume"><option value="">None</option></select>
          </div>
          <div class="field field--full"><label>Tags (comma separated)</label><input id="f-tags" /></div>
          <div class="field field--full"><label>Notes</label><textarea id="f-notes"></textarea></div>
        </div>
        <div class="modal__actions">
          <button id="f-save" class="btn btn--primary">Save</button>
          <button id="f-cancel" class="btn">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/pages/jobs.js"></script>
    <script type="module" src="/js/components/auth.js"></script>
  </body>
</html>
