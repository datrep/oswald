<!DOCTYPE html>
<html>

<head>
<title>Policy Dashboard</title>


<body>

<div class="layout">

<link rel="stylesheet" href="/css/main.css">
    <div class="sidebar">
        <div id="myClock" class="clock"> </div>

            <!-- to refresh, just /index.html instead of history.back() -->
            <button id="sleep cycle"><a href="/sleep-cycle.html">Back to Policies</a></button>


        <div class="add-policy-panel">  <!-- add policy panel should be moved to content div TODO:// -->
            <button id="add-policy">Add Policy</button>
                        <form id="add-policy-form" class="add-policy-form hidden">
                <h2>Add Policy</h2>
                <p class="muted">Fill in the basic fields for now; more data will be collected soon.</p>
                <div class="form-group">
                    <div class="label-with-help">
                        <label for="policy-name">Name</label>
                        <button type="button" class="help-btn" id="help-add-policy-name" aria-label="More info about policy name">?</button>
                    </div>
                    <input id="policy-name" name="policyName" type="text" placeholder="Policy name" required>
                </div>
                <div class="form-group">
                    <label for="policy-start">Start</label>
                    <input id="policy-start" name="policyStart" type="date" required>
                </div>
                <div class="form-group">
                    <label for="policy-end">End</label>
                    <input id="policy-end" name="policyEnd" type="date">
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-add-policy">Cancel</button>
                    <button type="submit">Save</button>
                </div>
                <p class="form-feedback hidden" id="add-policy-feedback"></p>
            </form>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <div style="color: #7279db;"> Ad astra, per aspera, mente et ferro, Per discrimina maxima tolerans.</div>
        </div>

        <div class="content">
        <h1>Policies</h1>

        <div class="policy-count"> 
             <div id="policy-count">
                    <!-- Count will be populated here -->
             </div>
        </div>

        <div class="policy-header">
            <span data-sort="name">Name</span>
            <span data-sort="plannedStart">Start</span>
            <span data-sort="plannedEnd">End</span>
            <span data-sort="taskCount">Tasks</span>
            <span data-sort="active">Active</span>
            <span data-sort="priority">Priority</span>
            <span data-sort="state">State</span>
            <span data-sort="info">Description</span>
        </div>


        <div id="policy-list"></div>

    </div>


        <div class="bottombar">
            <div style="color: #7279db;"> Audendo magnus tegitur, timor vincit qui patitur.</div>
        </div>

    </div>

</div>

<script src="/js/utils/helpers.js"></script>
<script type="module" src="/js/pages/index.js"></script>

</body>
</html>
