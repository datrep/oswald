<!DOCTYPE html>
<html>

<head>
<title>Policy Dashboard</title>


<body>

<div class="layout">

<link rel="stylesheet" href="/css/main.css">
    <div class="sidebar">
        <div class="add-policy-panel">
            <button id="add-policy">Add Policy</button>
                        <form id="add-policy-form" class="add-policy-form hidden">
                <h2>Add Policy</h2>
                <p class="muted">Fill in the basic fields for now; more data will be collected soon.</p>
                <div class="form-group">
                    <label for="policy-name">Name</label>
                    <input id="policy-name" name="policyName" type="text" placeholder="Policy name" required>
                </div>
                <div class="form-group">
                    <label for="policy-start">Start</label>
                    <input id="policy-start" name="policyStart" type="date" required>
                </div>
                <div class="form-group">
                    <label for="policy-end">End</label>
                    <input id="policy-end" name="policyEnd" type="date">
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-add-policy">Cancel</button>
                    <button type="submit">Save</button>
                </div>
                <p class="form-feedback hidden" id="add-policy-feedback"></p>
            </form>
        </div>
    </div>

    <div class="content">

        <h1>Policies</h1>

        <div class="policy-header">
            <span>Name</span>
            <span>Start</span>
            <span>End</span>
            <span>Tasks</span>
            <span>Active</span>
            <span>Priority</span>
            <span>State</span>
        </div>

        <div id="policy-count"></div>

        <div id="policy-list"></div>

    </div>

</div>

<script type="module" src="/js/pages/index.js"></script>

</body>
</html>
