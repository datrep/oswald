<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server configuration</title>
    <link rel="stylesheet" href="/css/main.css" />
    <style>
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 34px;
        max-width: 480px;
        text-align: center;
      }
      .card h1 {
        font-size: 1.2rem;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Server configuration</h1>
      <p class="muted">
        Coming soon — central settings for the managed servers (MCP filesystem server, Oswald
        fileserver, and future services) will live here.
      </p>
      <p><a href="/index.html">← Back to dashboard</a></p>
    </div>
  </body>
</html>
